version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: separaaltoke_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-separaaltoke_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Autoejecuta los scripts SQL en orden alfabético al inicializar la BD por primera vez
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: separaaltoke_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: separaaltoke_api
    depends_on:
      - db
      - redis
    ports:
      - "4261:4261"
    env_file:
      - ./backend/.env
    volumes:
      # Sincroniza el código en tiempo real para el hot-reload en desarrollo
      - ./backend:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
